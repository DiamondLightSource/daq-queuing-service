on:
  workflow_call:

env:
  # https://github.com/pytest-dev/pytest/issues/2042
  PY_IGNORE_IMPORTMISMATCH: "1"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Check out example services
          submodules: true

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-images-${{ runner.os }}-${{ hashFiles('tests/system_tests/compose.yaml') }}
          restore-keys: |
            docker-images-${{ runner.os }}-

      - name: Load Docker images
        run: |
          if [ -f /tmp/docker-cache/images.tar ]; then
            echo "Loading cached Docker images..."
            docker load -i /tmp/docker-cache/images.tar
          else
            echo "No cached Docker images found"
          fi
      

      - name: Compose service up
        run: docker compose --profile test -f tests/system_tests/compose.yaml up -d


      - name: Save Docker images
        if: always()
        run: |
          mkdir -p /tmp/docker-cache

          docker save \
            $(docker images --format '{{.Repository}}:{{.Tag}}') \
            -o /tmp/docker-cache/images.tar
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
       
      - name: Run tests
        run: uv run --locked tox -e tests
