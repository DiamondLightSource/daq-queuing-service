plugin:
  path: "daq_queuing_service.plugins"
  name: "QueuePlugin"
blueapi:
  api:
    url: "http://localhost:8000"
  stomp:
    enabled: true # All other stomp settings will be ignored if this is false
    url: tcp://localhost:61613
    auth:
      username: guest
      password: guest
runtime_estimation:
  enabled: true
  url: http://localhost:8002
logging:
  stream:
    level: "DEBUG"
  graylog:
    enabled: false
    level: "INFO"
instrument: "ixx"
